name: idiom_crossword
description: 成语填字游戏
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.3.2

  # 本地数据库
  drift: ^2.34.0
  sqlite3: ^3.3.4
  path_provider: ^2.1.6
  path: ^1.9.1

  # 音效
  audio_session: ^0.2.3
  audioplayers: ^6.8.1
  sound_mode_advanced: ^4.0.0

  # Game Center（排行榜）
  games_services: ^5.1.0

  auto_size_text: ^3.0.0
  flutter_svg: ^2.3.0

  # 广告
  google_mobile_ads: ^9.0.0
  app_tracking_transparency: ^2.0.7

  # 日志
  logger: ^2.7.0
  image_picker: ^1.2.3
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 代码生成
  drift_dev: ^2.16.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/idiom_crossword.db
    - assets/audio/
    - assets/images/

  fonts:
    - family: Noto Serif SC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifSC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerifSC-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSerifSC-Black.ttf
          weight: 900
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
