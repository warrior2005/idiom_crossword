name: idiom_crossword
description: 成语填字游戏
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.9.2
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.3.2

  # 本地数据库
  drift: ^2.34.0
  sqlite3: ^3.3.4
  path_provider: ^2.1.6
  path: ^1.9.1

  # 音效
  audioplayers: ^6.8.1

  auto_size_text: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 代码生成
  drift_dev: ^2.16.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/audio/

  # fonts 暂不配置，iOS 使用系统自带苹方和宋体，生僻字后续引入 fallback
